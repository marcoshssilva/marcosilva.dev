name: Build project using npm and Node.js 24
on:
  workflow_dispatch:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 24
      uses: actions/setup-node@v3
      with:
        node-version: 24
    - name: Install dependencies
      run: npm install
    - name: Run lint
      run: npm run lint
    - name: Run tests
      run: npm test
    - name: Build project
      run: npm run build
